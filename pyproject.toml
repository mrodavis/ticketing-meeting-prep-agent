[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ticketing-meeting-prep-agent"
version = "1.0.0"
description = "A LangGraph agent on Amazon Bedrock that preps arena account reps for client meetings: parallel data fetch, rule-based risk, grounded drafts, and human approval before anything is written to CRM."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1",
  "langchain-aws>=1.9",
  "langchain-core>=1.8",
  "boto3>=1.40",
  "pydantic>=2.8",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
meeting-prep = "meeting_prep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_prep = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]  # long string literals in fixtures and prompts
